name: 스팸 감지

on:
  schedule:
    # 평일 18:00~23:00 KST (= UTC 09:00~13:59)
    - cron: '*/10 9-13 * * 1-5'
    # 토요일 06:00~09:00 KST (= 금요일 21:00~23:59 UTC)
    - cron: '*/10 21-23 * * 5'
    # 토요일 09:00~23:00 KST (= 토요일 00:00~13:59 UTC)
    - cron: '*/10 0-13 * * 6'
    # 일요일 06:00~09:00 KST (= 토요일 21:00~23:59 UTC)
    - cron: '*/10 21-23 * * 6'
    # 일요일 09:00~23:00 KST (= 일요일 00:00~13:59 UTC)
    - cron: '*/10 0-13 * * 0'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 확인한 글 목록 복원
        uses: actions/cache@v4
        with:
          path: seen_posts.json
          key: seen-posts-${{ github.run_id }}
          restore-keys: seen-posts-

      - name: 스팸 감지 실행
        run: python main.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
